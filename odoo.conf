; Local development and test configuration for tour_booking.
;
; `db_host` is deliberately absent: with no host libpq falls back to the unix
; socket, which is how the Homebrew postgresql@16 service on this machine
; accepts connections (as the `danique` role, no password).
;
; `data_dir` points inside the repo rather than at the default
; ~/Library/Application Support/Odoo, so that running this module can never
; touch the property_booking filestores sitting there.

[options]
addons_path = /Users/danique/Github/odoo19/addons,/Users/danique/Github/touring-operations
data_dir = /Users/danique/Github/touring-operations/.odoo-data
db_user = danique
admin_passwd = admin
http_interface = 127.0.0.1
http_port = 8069
list_db = True
