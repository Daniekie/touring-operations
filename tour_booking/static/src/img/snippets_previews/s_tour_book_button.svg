<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430">
  <!-- This block used to preview by rendering itself, which drew one small
       button on an otherwise empty band and said nothing about what pressing
       it does. The picture shows the button *and* the panel it opens. -->
  <rect width="600" height="430" fill="#ffffff"/>
  <text x="300" y="48" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="700" fill="#212529">Book Now Button</text>
  <g transform="translate(0,70)">
    <rect x="200" y="16" width="200" height="46" rx="23" fill="#875a7b"/>
    <rect x="248" y="33" width="104" height="12" rx="6" fill="#ffffff"/>
    <!-- The panel it opens, greyed back so the button stays the subject. -->
    <g opacity=".55">
      <rect x="70" y="96" width="460" height="234" rx="10"
            fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
      <rect x="70" y="96" width="460" height="42" rx="10" fill="#f1f3f5"/>
      <rect x="94" y="112" width="150" height="12" rx="6" fill="#875a7b"/>
      <rect x="94" y="162" width="190" height="110" rx="6" fill="#7fb3c8"/>
      <rect x="316" y="162" width="190" height="110" rx="6" fill="#a8c9a0"/>
      <g fill="#adb5bd">
        <rect x="94" y="288" width="110" height="10" rx="5"/>
        <rect x="316" y="288" width="110" height="10" rx="5"/>
      </g>
    </g>
  </g>
</svg>
