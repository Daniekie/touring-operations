<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430">
  <!-- Titled, because the gallery shows these pictures with no caption of
       their own: four wireframes of coloured rectangles are four white cards
       an operator has to drop to tell apart. -->
  <rect width="600" height="430" fill="#ffffff"/>
  <text x="300" y="48" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="700" fill="#212529">All Experiences</text>
  <g transform="translate(0,70)">
    <g>
      <rect x="30" y="30" width="255" height="140" rx="6" fill="#7fb3c8"/>
      <rect x="315" y="30" width="255" height="140" rx="6" fill="#5f9ea0"/>
      <rect x="30" y="200" width="255" height="130" rx="6" fill="#a8c9a0"/>
      <rect x="315" y="200" width="255" height="130" rx="6" fill="#8fc1d4"/>
    </g>
    <g fill="#ffffff" opacity=".92">
      <rect x="30" y="170" width="255" height="30"/>
      <rect x="315" y="170" width="255" height="30"/>
    </g>
    <g fill="#875a7b">
      <rect x="44" y="180" width="96" height="10" rx="5"/>
      <rect x="329" y="180" width="80" height="10" rx="5"/>
    </g>
    <g fill="#adb5bd">
      <rect x="44" y="340" width="70" height="8" rx="4"/>
      <rect x="329" y="340" width="70" height="8" rx="4"/>
    </g>
  </g>
</svg>
